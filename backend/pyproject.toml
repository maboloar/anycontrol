[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anycontrol-web"
version = "1.0.0"
description = "AnyControl Web - 카메라로 물체와 손을 추적해 가상 입력으로 매핑하는 로컬 웹앱 백엔드"
requires-python = ">=3.12"
# 버전은 고정한다 (재현성·공급망 안전).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "websockets==17.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "numpy==2.5.3",
    # mediapipe 가 opencv-contrib-python 에 의존하므로 opencv-python 과 섞지 않는다.
    "opencv-contrib-python==5.0.0.93",
    "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",   # 손 인식 엔진 Apple Vision (기본)
]

[project.optional-dependencies]
# 마스크 모델·손·임베딩. EfficientTAM은 third_party 소스를 PYTHONPATH로 로드한다.
ml = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    # 1.0.1 은 macOS 에서 graph_service "Service is unavailable" 로 abort → 0.10.35 고정
    "mediapipe==0.10.35",
    "timm==1.0.30",
    "hydra-core==1.3.7",
    "iopath==0.1.10",
    "huggingface_hub==2.0.0",
]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.2",
    "httpx==0.28.1",
    "websockets==17.1",
]

[project.scripts]
vision-input = "vision_input.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
